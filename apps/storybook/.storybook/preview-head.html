<!--
  Web fonts for the helix design language.

  Inter (variable weights 300–900 incl. 800) is the primary prose face.
  Weight 800 powers the editorial hero headline (clamp(48px, 6vw, 96px),
  line-height 0.95, letter-spacing -0.035em) imported from the dist
  review bundle (`/Users/himerus/Downloads/dist/foundation/04-type.html`).

  JetBrains Mono is the engineering/eyebrow face — token names, code
  samples, mono-meta annotations, force-state labels. Loaded with the
  full 100..900 range so docs MDX can drive weight per surface.

  Both are sourced from Google Fonts to keep the preconnect target set
  to the same origin as the rest of helix's font tooling.

  Note: `helix-docs.css` and `force-states.css` are imported through
  `preview.ts` so Vite handles bundling and the @layer hx-docs cascade
  is established before any MDX page mounts.
-->
