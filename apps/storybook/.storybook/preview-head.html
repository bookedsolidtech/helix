<!--
  FOUC prevention.

  Storybook's `addon-themes` decorator runs AFTER first paint, so without
  this block the preview iframe paints once at default-light tokens before
  the persisted theme/brand attributes apply. That produces a visible
  flash on dark/high-contrast pages.

  We resolve theme + brand from three sources, in priority order:
    1. URL `globals` parameter (Storybook's authoritative state on nav)
    2. `localStorage["helix:storybook:globals"]` shadow we maintain in the
       preview decorators (see preview.ts) — survives reloads.
    3. Default ('light' theme, no brand) — matches initialGlobals.

  The :root background-color is also primed to the surface-default token
  so the very first paint is at least neutral instead of a stark white
  rectangle behind the preview iframe.
-->
<script>
  (function () {
    try {
      var html = document.documentElement;
      var theme = '';
      var brand = '';

      // 1. URL globals param: ?globals=theme:dark;brand:meridian
      try {
        var url = new URL(window.location.href);
        var raw = url.searchParams.get('globals') || '';
        raw.split(';').forEach(function (pair) {
          var idx = pair.indexOf(':');
          if (idx === -1) return;
          var k = pair.slice(0, idx).trim();
          var v = pair.slice(idx + 1).trim();
          if (k === 'theme') theme = v;
          else if (k === 'brand') brand = v;
        });
      } catch (_e) {
        /* URL parse failure — fall through to storage */
      }

      // 2. localStorage shadow (set by preview.ts decorators)
      if (!theme || !brand) {
        try {
          var stored = window.localStorage.getItem('helix:storybook:globals');
          if (stored) {
            var parsed = JSON.parse(stored);
            if (!theme && parsed && typeof parsed.theme === 'string') theme = parsed.theme;
            if (!brand && parsed && typeof parsed.brand === 'string') brand = parsed.brand;
          }
        } catch (_e) {
          /* storage disabled or JSON broken — fall through */
        }
      }

      // 3. Default theme is 'light'; brand stays empty (HELiX default).
      if (!theme) theme = 'light';

      html.setAttribute('data-theme', theme);
      if (brand) html.setAttribute('data-brand', brand);
      else html.removeAttribute('data-brand');
    } catch (_e) {
      /* never throw from FOUC-prevention; the decorator will catch up */
    }
  })();
</script>
<style>
  /*
   * Pre-paint surface neutralizer. `color-scheme` lets the UA paint
   * canvas/scrollbars in the right tone before any tokens load.
   * Token fallback chain mirrors @helixui/tokens — if the token CSS
   * has not yet hydrated, the hex fallback is the published light
   * surface-default, which is closer to "right" than UA white.
   */
  :root {
    color-scheme: light dark;
    background-color: var(--hx-color-surface-default, #ffffff);
  }
  :root[data-theme='dark'] {
    color-scheme: dark;
    background-color: var(--hx-color-surface-default, #0d1825);
  }
  :root[data-theme='high-contrast'] {
    color-scheme: dark;
    background-color: var(--hx-color-surface-default, #000000);
  }
  /* Prevent the iframe from flashing stark white before tokens load. */
  html,
  body {
    background-color: var(--hx-color-surface-default, #ffffff);
  }
</style>
