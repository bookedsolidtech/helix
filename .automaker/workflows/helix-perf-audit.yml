name: helix-perf-audit
description: Bundle size, render performance, and lazy loading analysis
phases:
  - state: INTAKE
    enabled: true
  - state: PLAN
    enabled: false
  - state: EXECUTE
    enabled: true
  - state: REVIEW
    enabled: false
  - state: MERGE
    enabled: false
  - state: DEPLOY
    enabled: false
agent:
  role: performance-engineer
  model: sonnet
  promptFile: .automaker/prompts/perf-audit.md
  tools:
    - Read
    - Grep
    - Glob
    - Bash
execution:
  useWorktrees: false
  gitWorkflow:
    autoCommit: false
    autoPush: false
    autoCreatePR: false
  outputDir: .automaker/audits
  terminalStatus: done
match:
  categories: [perf-audit, performance-audit]
  keywords: [bundle, performance, lighthouse, perf]
