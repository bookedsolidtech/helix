name: helix-a11y-audit
description: WCAG 2.1 AA accessibility audit — healthcare mandate, zero regressions
phases:
  - state: INTAKE
    enabled: true
  - state: PLAN
    enabled: false
  - state: EXECUTE
    enabled: true
  - state: REVIEW
    enabled: false
  - state: MERGE
    enabled: false
  - state: DEPLOY
    enabled: false
agent:
  role: accessibility-engineer
  model: opus
  promptFile: .automaker/prompts/a11y-audit.md
  tools:
    - Read
    - Grep
    - Glob
execution:
  useWorktrees: false
  gitWorkflow:
    autoCommit: false
    autoPush: false
    autoCreatePR: false
  outputDir: .automaker/audits
  terminalStatus: done
match:
  categories: [a11y-audit, accessibility-audit]
  keywords: [accessibility, wcag, a11y, aria, keyboard]
