name: helix-fix
description: Bug fixes and audit remediation — code changes with PR, no architectural planning
phases:
  - state: INTAKE
    enabled: true
  - state: PLAN
    enabled: false
  - state: EXECUTE
    enabled: true
  - state: REVIEW
    enabled: true
  - state: MERGE
    enabled: true
  - state: DEPLOY
    enabled: false
agent:
  role: principal-engineer
  model: sonnet
execution:
  useWorktrees: true
  gitWorkflow:
    autoCommit: true
    autoPush: true
    autoCreatePR: true
    autoMergePR: true
    prBaseBranch: dev
  terminalStatus: review
context:
  - agent-push-protocol.md
  - test-verification-workflow.md
  - shadow-dom-story-test-patterns.md
match:
  categories: [fix, bug-fix, remediation]
  keywords: [fix, bug, patch, remediate]
