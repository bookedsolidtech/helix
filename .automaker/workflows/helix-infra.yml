name: helix-infra
description: Infrastructure, CI/CD, and DevOps changes
phases:
  - state: INTAKE
    enabled: true
  - state: PLAN
    enabled: true
  - state: EXECUTE
    enabled: true
  - state: REVIEW
    enabled: true
  - state: MERGE
    enabled: true
  - state: DEPLOY
    enabled: true
agent:
  role: devops-engineer
  model: sonnet
execution:
  useWorktrees: true
  gitWorkflow:
    autoCommit: true
    autoPush: true
    autoCreatePR: true
    autoMergePR: true
    prBaseBranch: dev
  terminalStatus: review
match:
  categories: [infrastructure, infra, devops, ci]
  keywords: [ci, pipeline, deploy, publish, turbo]
