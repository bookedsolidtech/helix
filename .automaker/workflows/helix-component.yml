name: helix-component
description: Full component implementation — Lit 3.x, shadow DOM, tokens, tests, stories, CEM
phases:
  - state: INTAKE
    enabled: true
  - state: PLAN
    enabled: true
  - state: EXECUTE
    enabled: true
  - state: REVIEW
    enabled: true
  - state: MERGE
    enabled: true
  - state: DEPLOY
    enabled: true
agent:
  role: lit-specialist
  model: sonnet
  promptFile: .automaker/prompts/component-impl.md
execution:
  useWorktrees: true
  gitWorkflow:
    autoCommit: true
    autoPush: true
    autoCreatePR: true
    autoMergePR: true
    prBaseBranch: dev
  terminalStatus: review
context:
  - agent-push-protocol.md
  - test-verification-workflow.md
  - shadow-dom-story-test-patterns.md
match:
  categories: [component, component-impl]
  keywords: [component, hx-]
