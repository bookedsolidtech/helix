# ============================================================================
# CI Pipeline — HELiX Enterprise Healthcare Web Component Library
# ============================================================================
# Parallel quality gates — each job runs independently for fast feedback:
#   1. Lint (ESLint 9 flat config)
#   2. Format (Prettier)
#   3. Type check (TypeScript strict, zero errors)
#   4. Test (Vitest browser mode + Playwright Chromium)
#   5. Build + CEM + Bundle size (Vite library mode via Turborepo)
#   6. VRT (Visual regression via Storybook)
# ============================================================================

name: CI

on:
  push:
    branches: [main, dev, staging, 'changeset-release/**']
    paths-ignore:
      - '**/*.md'
      - '.automaker/**'
      - '.claude/**'
      - 'LICENSE'
      - '.editorconfig'
  pull_request:
    branches: [main, dev, staging]
    paths-ignore:
      - '**/*.md'
      - '.automaker/**'
      - '.claude/**'
      - 'LICENSE'
      - '.editorconfig'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

# ── Shared setup anchor ────────────────────────────────────────────────────
# Reusable setup steps referenced by all jobs

jobs:
  # ── Secret scanning ─────────────────────────────────────────────────────
  # Runs FIRST — before any build or test job — to ensure no credentials,
  # tokens, or secrets are present in the diff or pushed commits.
  # Agents in worktrees may not have gitleaks installed locally, making this
  # the primary enforcement layer for the monorepo.

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan PR diff for secrets
        if: github.event_name == 'pull_request'
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --redact \
            --no-git=false \
            --exit-code 1

      - name: Scan push diff for secrets
        if: github.event_name == 'push'
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts "HEAD~1..HEAD" \
            --redact \
            --no-git=false \
            --exit-code 1

  # ── Change detection ───────────────────────────────────────────────────
  # Determines which jobs to run based on changed files.
  # Audit-only PRs (AUDIT.md files) skip Test and VRT.

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      source: ${{ steps.filter.outputs.source }}
      is_audit: ${{ steps.check-audit.outputs.is_audit }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if audit branch
        id: check-audit
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          # Per-component audit branches are banned — audits must use the batch
          # workflow defined in .automaker/context/audit-workflow.md.
          # Catches: feature/audithx-{component}-*, feature/audit-hx-{component}-*
          if [[ "$BRANCH" == *"audithx-"* ]] || [[ "$BRANCH" =~ ^feature/audit-hx-[a-z] ]]; then
            echo "::error::Per-component audit branch detected: $BRANCH"
            echo "::error::Audit workflow violation — individual component branches are banned."
            echo "::error::Use the batch audit workflow: audit/audit-wave-N-{type} with grouped fixes."
            echo "::error::See .automaker/context/audit-workflow.md for the correct 4-phase process."
            echo "is_audit=true" >> "$GITHUB_OUTPUT"
            exit 1
          elif [[ "$BRANCH" == *"deep-audit"* ]] || [[ "$BRANCH" == *"audit/"* ]]; then
            echo "is_audit=true" >> "$GITHUB_OUTPUT"
            echo "Audit branch detected: $BRANCH — skipping CI"
          else
            echo "is_audit=false" >> "$GITHUB_OUTPUT"
          fi

          # Detect audit batch branches (handled by audit-batch-ci.yml)
          if [[ "$BRANCH" == audit/deep-quality-batch-* ]]; then
            echo "is_audit_batch=true" >> "$GITHUB_OUTPUT"
            echo "Audit BATCH branch detected: $BRANCH — defer to audit-batch-ci.yml"
          else
            echo "is_audit_batch=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            source:
              - 'packages/hx-library/src/**/*.ts'
              - 'packages/hx-library/src/**/*.styles.ts'
              - 'packages/hx-library/vite.config.ts'
              - 'packages/hx-library/vitest.config.ts'
              - 'packages/hx-library/coverage-config.json'
              - 'packages/hx-library/tsconfig*.json'
              - 'scripts/check-coverage.mjs'
              - 'scripts/check-bundle-size.mjs'
              - 'scripts/check-cdn-size.mjs'
              - 'bundle-budgets.json'
              - '.bundle-budget.json'
              - '.cdn-budget.json'
              - 'packages/hx-library/scripts/build-cdn.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - '.github/workflows/**'

  # ── Fast checks (no build needed, <30s each) ────────────────────────────

  lint:
    name: Lint
    needs: [changes, secret-scan]
    if: needs.changes.outputs.is_audit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  format:
    name: Format
    needs: [changes, secret-scan]
    if: needs.changes.outputs.is_audit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  react-generator-drift:
    name: React Generator Drift
    needs: [changes, secret-scan]
    if: needs.changes.outputs.is_audit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate CEM (required input for drift check)
        run: pnpm --filter=@helixui/library run cem
      - name: Verify Figma inventory file is byte-identical after CEM regen
        run: |
          # Use `git status --porcelain` so both modified AND untracked changes
          # fail the gate. `git diff --exit-code` would silently pass if the
          # committed inventory was deleted and CEM regeneration re-created it
          # as a new (untracked) file — exactly the drift case we need to catch.
          STATUS=$(git status --porcelain -- packages/hx-library/figma-inventory.json)
          if [ -n "$STATUS" ]; then
            echo "::error::figma-inventory.json drifted after CEM regeneration. Run 'pnpm --filter=@helixui/library run figma:inventory' and commit."
            echo "$STATUS"
            exit 1
          fi
      - name: Verify @helixui/react wrappers are in sync with CEM
        run: pnpm --filter=@helixui/react run generate:check
      - name: Verify Figma inventory matches committed snapshot
        run: pnpm --filter=@helixui/library run figma:inventory:check

  type-check:
    name: Type Check
    needs: [changes, secret-scan]
    if: needs.changes.outputs.is_audit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Build @helixui/library first — @helixui/react's type-check resolves
      # deep-path imports (`@helixui/library/components/*`) through the
      # `exports` map which points at `dist/`. Turbo's `^build` dependency is
      # not reliably honored on fresh CI runners, so build explicitly.
      - run: pnpm turbo run build --filter=@helixui/library
      - run: pnpm turbo run type-check --filter='!docs'

  # ── Tests (need Playwright browsers) ────────────────────────────────────
  # Path-filtered by changed components, then split across an 8-way shard
  # matrix via vitest's native --shard flag. Each shard runs its slice of the
  # selected test files in its own Chromium, so wall time drops ~8x on
  # large-touch PRs while single-component PRs short-circuit empty shards
  # quickly. The shared watchdog (scripts/lib/vitest-watchdog.sh) handles the
  # Vitest 3.x Chromium teardown hang — still present on sharded runs.
  #
  # Why 8 and not 4: full-tree feature PRs (e.g. 3.2.0 palette refresh which
  # touched ~80 .styles.ts files and re-instrumented every component under v8
  # coverage) regularly drove shards 1 and 3 of the 4-way matrix to a hang
  # signature — ~12s of vitest output, then 600s of total silence, then
  # watchdog kill. Halving the per-shard load (~19 → ~10 test files, ~1300 →
  # ~650 tests) keeps each Chromium process well under the threshold where
  # coverage instrumentation + browser-mode + a freshly-imported shared mixin
  # module appear to deadlock collection.

  test:
    name: Test (${{ matrix.shard }})
    needs: [changes, secret-scan]
    if: needs.changes.outputs.source == 'true' && needs.changes.outputs.is_audit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8', '8/8']
    env:
      AGENT_RUN: '1'
      VITEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter='!docs'
      - run: pnpm exec playwright install --with-deps chromium
      - name: Resolve changed components
        id: changed
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${{ github.head_ref }}"
            BASE="${{ github.base_ref }}"
            if [[ "$BRANCH" == "staging" && "$BASE" == "main" ]]; then
              echo "Promotion PR (staging → main) — tests already verified on staging."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$BRANCH" =~ feature/audit-fix-(hx-[a-z-]+) ]]; then
              COMPONENT="${BASH_REMATCH[1]}"
              echo "paths=src/components/$COMPONENT/" >> "$GITHUB_OUTPUT"
              echo "components_csv=$COMPONENT" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            DIFF_RANGE="origin/$BASE...HEAD"
          else
            DIFF_RANGE="HEAD~1...HEAD"
          fi

          CHANGED=$(git diff --name-only "$DIFF_RANGE" \
            | grep 'src/components/hx-' \
            | grep -v '\.stories\.ts$' \
            | grep -v '\.test\.ts$' \
            | grep -v '/index\.ts$' \
            | sed 's|.*src/components/\(hx-[^/]*\)/.*|\1|' \
            | sort -u || true)
          # Shared tests under src/components/__tests__/ (e.g. dark-mode-resolution)
          # don't belong to a single component but exercise cross-cutting behavior.
          # If the diff touches one, we cannot derive a component scope — fall back
          # to the full test suite so the shared regression test actually runs.
          SHARED_TESTS=$(git diff --name-only "$DIFF_RANGE" \
            | grep 'src/components/__tests__/' \
            | grep '\.test\.ts$' || true)
          if [ -n "$SHARED_TESTS" ]; then
            echo "Shared test changed — running full suite (no scope filter)"
            echo "shared_tests_changed=true" >> "$GITHUB_OUTPUT"
            echo "paths=" >> "$GITHUB_OUTPUT"
            echo "components_csv=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$CHANGED" ]; then
            echo "No component changes — skipping tests"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PATHS=$(echo "$CHANGED" | sed 's|^|src/components/|' | sed 's|$|/|' | tr '\n' ' ')
          COMPONENTS_CSV=$(echo "$CHANGED" | tr '\n' ',' | sed 's/,$//')
          echo "paths=$PATHS" >> "$GITHUB_OUTPUT"
          echo "components_csv=$COMPONENTS_CSV" >> "$GITHUB_OUTPUT"
      - name: Run shard ${{ matrix.shard }}
        id: run-tests
        if: steps.changed.outputs.skip != 'true'
        env:
          HX_COVERAGE_COMPONENTS: ${{ steps.changed.outputs.components_csv }}
          # Browser-mode vitest with 73 components legitimately needs long
          # silent stretches during Playwright/Chromium bundle + setup phases.
          # 240s was insufficient (shards 1+3 hit stale-output kill at exactly
          # the 240s mark on full-tree feature-PR runs). 600s gives 5x headroom
          # over the longest known passing shard (~120s) while still catching
          # genuine hangs (10 minutes silent is unambiguously stuck).
          STALE_TIMEOUT: '600'
        run: |
          # shellcheck disable=SC1091
          source "$GITHUB_WORKSPACE/scripts/lib/vitest-watchdog.sh"
          LOGFILE=$(mktemp /tmp/helix-ci-shard.XXXXXX)
          PATHS="${{ steps.changed.outputs.paths }}"
          echo "Running shard ${VITEST_SHARD} over: $PATHS"
          # Vitest 3.x refuses to run when the shard total is >= the number
          # of test files ("--shard <count> must be a smaller than count of
          # test files"). When the smart-changed filter resolves fewer test
          # files than the matrix has shards, collapse: shard 1 runs every
          # file unsharded, and the other shards exit cleanly with nothing
          # to do. Without this, a PR that touches 1–3 components fails all
          # 4 shards with a cryptic startup error.
          # shellcheck disable=SC2086
          TEST_FILE_COUNT=$(find $PATHS -type f -name '*.test.ts' 2>/dev/null | wc -l | tr -d ' ')
          TEST_FILE_COUNT=${TEST_FILE_COUNT:-0}
          SHARD_INDEX="${VITEST_SHARD%/*}"
          SHARD_TOTAL="${VITEST_SHARD#*/}"
          SHARD_ARGS=(--shard="$VITEST_SHARD")
          if [[ "$TEST_FILE_COUNT" -le "$SHARD_TOTAL" ]]; then
            if [[ "$TEST_FILE_COUNT" -eq 0 ]]; then
              echo "[ci-shard-${VITEST_SHARD}] no test files resolved from: $PATHS — skipping"
              echo "tests_ran=true" >> "$GITHUB_OUTPUT"
              mkdir -p .cache
              echo '{"testResults":[],"numTotalTests":0,"numPassedTests":0,"numFailedTests":0}' > .cache/test-results.json
              # Codex push-gate round-6 finding 1: write the empty-shard
              # sentinel so check-coverage.mjs can distinguish an
              # intentionally-empty shard from a crashed vitest run.
              mkdir -p .cache/coverage
              echo "intentionally-empty shard ${VITEST_SHARD}" > .cache/coverage/empty-shard.flag
              exit 0
            fi
            if [[ "$SHARD_INDEX" -ne 1 ]]; then
              echo "[ci-shard-${VITEST_SHARD}] only $TEST_FILE_COUNT test files — skipping (shard ${SHARD_INDEX}/${SHARD_TOTAL} has nothing to run)"
              echo "tests_ran=true" >> "$GITHUB_OUTPUT"
              # Write an empty JSON report so the upload-artifact step has
              # something to find and does not warn.
              mkdir -p .cache
              echo '{"testResults":[],"numTotalTests":0,"numPassedTests":0,"numFailedTests":0}' > .cache/test-results.json
              # Codex push-gate round-6 finding 1: write the empty-shard
              # sentinel so check-coverage.mjs can distinguish an
              # intentionally-empty shard from a crashed vitest run.
              mkdir -p .cache/coverage
              echo "intentionally-empty shard ${VITEST_SHARD}" > .cache/coverage/empty-shard.flag
              exit 0
            fi
            echo "[ci-shard-${VITEST_SHARD}] only $TEST_FILE_COUNT test files — running all on shard 1 without --shard"
            SHARD_ARGS=()
          fi
          # Use verbose reporter so the watchdog can count ✓/× markers when
          # vitest is force-killed before its summary line is flushed.
          # Keep json so .cache/test-results.json is still written (vitest
          # replaces config reporters when --reporter is passed).
          # Do not let `set -e` abort the step when the watchdog returns
          # non-zero — we need the diagnostic block below to surface vitest's
          # actual error instead of GitHub Actions killing the step with no
          # output on the way.
          rc=0
          # shellcheck disable=SC2086
          run_vitest_with_watchdog "ci-shard-${VITEST_SHARD}" "$LOGFILE" \
            pnpm exec vitest run $PATHS \
              "${SHARD_ARGS[@]}" \
              --reporter=verbose \
              --reporter=json || rc=$?
          # On failure, surface only failed test lines + tail of log.
          # On success, suppress the log entirely — passing ticks are noise.
          if [[ $rc -ne 0 ]]; then
            echo "FAILED TESTS:"
            grep "^[[:space:]]*×" "$LOGFILE" 2>/dev/null | head -60 || true
            echo ""
            # Only print the pre-coverage slice when the marker is actually
            # present — otherwise awk falls through and duplicates the whole
            # log against the tail -50 below.
            if grep -q "Coverage report from" "$LOGFILE" 2>/dev/null; then
              echo "--- vitest error output (everything before Coverage report) ---"
              awk '/Coverage report from/{exit} {print}' "$LOGFILE" || true
              echo ""
            fi
            echo "--- last 50 lines of full log ---"
            tail -50 "$LOGFILE" || true
          fi
          echo "tests_ran=true" >> "$GITHUB_OUTPUT"
          exit $rc
        working-directory: packages/hx-library
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ strategy.job-index }}-of-${{ strategy.job-total }}
          path: packages/hx-library/.cache/test-results.json
          retention-days: 30
          if-no-files-found: warn

  # ── Coverage (decoupled from per-shard runs) ────────────────────────────
  # Runs the full test surface in a single instrumented vitest pass and
  # enforces per-component thresholds via scripts/check-coverage.mjs.
  #
  # Why a dedicated job (cycles 5 + 6 of PR #1554, 3.2.0 palette refresh):
  # the original design ran coverage on every shard. Under v8 instrumentation
  # in browser-mode, two of eight shards consistently deadlocked — ~12s of
  # collection output, then 600s of total silence, then watchdog kill. The
  # 4→8 rebalance only moved which shards were affected; it didn't eliminate
  # the deadlock. Running coverage in a single instrumented pass restores a
  # working signal: per-shard runs verify behavior (uninstrumented, fast),
  # this job verifies coverage (instrumented, slow, isolated). If this job
  # hangs we know it's the coverage path; if a shard hangs we know it's not.

  coverage:
    name: Coverage
    needs: [changes, secret-scan]
    if: needs.changes.outputs.source == 'true' && needs.changes.outputs.is_audit != 'true'
    runs-on: ubuntu-latest
    # vitest --coverage.enabled + browser-mode + chromium deadlocks at this
    # surface size regardless of how the work is partitioned. Tracked at
    # https://github.com/bookedsolidtech/helix/issues/1556. Until the infra
    # bug is resolved, this job runs informationally — it posts the partial
    # coverage report comment but does NOT block Quality Gates. The 8-shard
    # uninstrumented test matrix is the real correctness signal.
    continue-on-error: true
    # Full instrumented suite is materially slower than uninstrumented
    # browser-mode runs. 45m gives generous headroom over the projected
    # 15–30m wall time without re-introducing the 600s watchdog kill that
    # took out the per-shard coverage path.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter='!docs'
      - run: pnpm exec playwright install --with-deps chromium
      - name: Resolve changed components
        id: changed
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${{ github.head_ref }}"
            BASE="${{ github.base_ref }}"
            if [[ "$BRANCH" == "staging" && "$BASE" == "main" ]]; then
              echo "Promotion PR (staging → main) — coverage already verified on staging."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$BRANCH" =~ feature/audit-fix-(hx-[a-z-]+) ]]; then
              COMPONENT="${BASH_REMATCH[1]}"
              echo "components_csv=$COMPONENT" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            DIFF_RANGE="origin/$BASE...HEAD"
          else
            DIFF_RANGE="HEAD~1...HEAD"
          fi

          CHANGED=$(git diff --name-only "$DIFF_RANGE" \
            | grep 'src/components/hx-' \
            | grep -v '\.stories\.ts$' \
            | grep -v '\.test\.ts$' \
            | grep -v '/index\.ts$' \
            | sed 's|.*src/components/\(hx-[^/]*\)/.*|\1|' \
            | sort -u || true)
          SHARED_TESTS=$(git diff --name-only "$DIFF_RANGE" \
            | grep 'src/components/__tests__/' \
            | grep '\.test\.ts$' || true)
          if [ -n "$SHARED_TESTS" ]; then
            echo "Shared test changed — running coverage with no scope filter"
            echo "shared_tests_changed=true" >> "$GITHUB_OUTPUT"
            echo "components_csv=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$CHANGED" ]; then
            echo "No component changes — skipping coverage"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COMPONENTS_CSV=$(echo "$CHANGED" | tr '\n' ',' | sed 's/,$//')
          echo "components_csv=$COMPONENTS_CSV" >> "$GITHUB_OUTPUT"
      - name: Run full suite with coverage
        id: run-coverage
        if: steps.changed.outputs.skip != 'true'
        env:
          AGENT_RUN: '1'
          HX_COVERAGE_COMPONENTS: ${{ steps.changed.outputs.components_csv }}
          # Same watchdog threshold as per-shard (600s silent = unambiguously
          # stuck), but applied to a single un-sharded run. The full suite
          # under instrumentation has longer legitimate silent stretches than
          # any individual shard, but 10 minutes of zero output is still a
          # hang, not slow progress.
          STALE_TIMEOUT: '600'
        run: |
          # shellcheck disable=SC1091
          source "$GITHUB_WORKSPACE/scripts/lib/vitest-watchdog.sh"
          LOGFILE=$(mktemp /tmp/helix-ci-coverage.XXXXXX)
          rc=0
          run_vitest_with_watchdog "ci-coverage" "$LOGFILE" \
            pnpm exec vitest run \
              --coverage.enabled \
              --reporter=verbose \
              --reporter=json || rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "FAILED TESTS:"
            grep "^[[:space:]]*×" "$LOGFILE" 2>/dev/null | head -60 || true
            echo ""
            if grep -q "Coverage report from" "$LOGFILE" 2>/dev/null; then
              echo "--- vitest error output (everything before Coverage report) ---"
              awk '/Coverage report from/{exit} {print}' "$LOGFILE" || true
              echo ""
            fi
            echo "--- last 50 lines of full log ---"
            tail -50 "$LOGFILE" || true
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          exit $rc
        working-directory: packages/hx-library
      - name: Enforce coverage thresholds for changed components
        # Single-run coverage means no shard intersection logic is needed —
        # the full suite executed, so HX_COVERAGE_COMPONENTS is the
        # authoritative scope. Skipped on shared-test/unscoped runs (the
        # check-coverage script handles unscoped fall-through, but for
        # shared-test PRs we want the whole library checked, which is the
        # default behavior with HX_COVERAGE_COMPONENTS unset).
        if: steps.run-coverage.outputs.ran == 'true'
        env:
          HX_COVERAGE_COMPONENTS: ${{ steps.changed.outputs.components_csv }}
        run: node scripts/check-coverage.mjs
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: packages/hx-library/.cache/coverage/
          retention-days: 14
          if-no-files-found: warn
      - name: Post coverage summary as PR comment
        if: github.event_name == 'pull_request' && steps.changed.outputs.shared_tests_changed != 'true' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          HX_COVERAGE_COMPONENTS: ${{ steps.changed.outputs.components_csv }}
        run: |
          BODY=$(node scripts/check-coverage.mjs --markdown 2>/dev/null || echo "## Coverage Report\n\nCoverage data unavailable for this PR.")

          PREV=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --json comments \
            --jq '.comments[] | select(.body | startswith("## Coverage Report")) | .id' \
            2>/dev/null | head -1 || true)
          if [ -n "$PREV" ]; then
            gh api --method DELETE \
              "/repos/${{ github.repository }}/issues/comments/$PREV" \
              2>/dev/null || true
          fi

          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "$BODY"

  # ── Build + CEM + Bundle size ───────────────────────────────────────────

  build:
    name: Build
    needs: [changes, secret-scan]
    if: needs.changes.outputs.is_audit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter='!docs'
      - name: Generate and validate CEM
        run: pnpm run cem
        working-directory: packages/hx-library
      - name: Validate package exports (pnpm publish --dry-run)
        run: pnpm publish --dry-run --no-git-checks
        working-directory: packages/hx-library
      - name: Bundle size report (all components, tree-shaken)
        run: node scripts/bundle-size-report.js --save .cache/bundle-size-report.json
      - name: Upload bundle size artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-report
          path: .cache/bundle-size-report.json
          retention-days: 30
          if-no-files-found: warn
      # ── CDN bundle + size budget (FS-019) ───────────────────────────────
      # The CDN payload is what Drupal/CDN consumers download. Budget is
      # per-artifact and enforced via .cdn-budget.json. Gate fails on any
      # artifact exceeding its ceiling.
      - name: Build CDN artifacts
        run: pnpm --filter=@helixui/library run build:cdn
      - name: Enforce CDN size budget
        run: node scripts/check-cdn-size.mjs
      - name: Save CDN size report
        if: always()
        run: |
          mkdir -p .cache
          node scripts/check-cdn-size.mjs --json > .cache/cdn-size-report.json 2>/dev/null || true
      - name: Upload CDN size artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdn-size-report
          path: .cache/cdn-size-report.json
          retention-days: 30
          if-no-files-found: warn

  # ── Automated A11y Audit (axe-core WCAG 2.1 AA) ─────────────────────────
  # Builds Storybook, serves it locally, then runs axe-core against every
  # component's Default story. Fails CI on any critical or serious violation.
  # Healthcare mandate: critical/serious violations block merge — WCAG 2.1 AA,
  # wcag2a + wcag2aa + best-practice tags. Report uploaded as artifact for triage.

  a11y-audit:
    name: A11y Audit
    needs: [changes, secret-scan, build]
    if: needs.changes.outputs.is_audit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter='!docs'
      - name: Build Storybook
        run: pnpm run build:storybook
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Serve Storybook and run axe-core audit
        run: |
          pnpm exec http-server apps/storybook/dist -p 6006 --silent &
          SERVER_PID=$!
          # Wait for server to be ready (up to 30s)
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:6006/index.html | grep -q "200"; then
              echo "Storybook server ready after ${i}s"
              break
            fi
            sleep 1
          done
          node scripts/a11y-audit.js \
            --storybook-url http://localhost:6006 \
            --output .cache/a11y-report.json
          EXIT_CODE=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $EXIT_CODE
      - name: Upload a11y report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: .cache/a11y-report.json
          retention-days: 30
          if-no-files-found: warn

  # ── CEM API Diff ────────────────────────────────────────────────────────
  # Compares custom-elements.json between base and PR branch.
  # Posts a PR comment with added/removed/changed public API per component.
  # Breaking changes (removals, type changes) are flagged with warnings.
  # Informational only — does not block merge.

  cem-diff:
    name: CEM API Diff
    needs: [changes, secret-scan]
    if: >
      github.event_name == 'pull_request' &&
      needs.changes.outputs.is_audit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate head CEM
        run: pnpm --filter=@helixui/library run cem
      - name: Save head CEM
        run: |
          mkdir -p .cache
          cp packages/hx-library/custom-elements.json .cache/head-cem.json
      - name: Check out base branch source
        run: |
          git checkout "origin/${{ github.base_ref }}" -- packages/hx-library/src/ 2>/dev/null || true
      - name: Generate base CEM
        run: pnpm --filter=@helixui/library run cem
      - name: Run CEM diff
        run: |
          mkdir -p .cache
          node scripts/cem-diff.js \
            --base packages/hx-library/custom-elements.json \
            --head .cache/head-cem.json \
            --output .cache/cem-diff.md
      - name: Post PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(cat .cache/cem-diff.md)
          # Delete any previous CEM diff comment before posting a new one
          PREV=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --json comments \
            --jq '.comments[] | select(.body | startswith("## CEM API Diff")) | .id' \
            2>/dev/null | head -1 || true)
          if [ -n "$PREV" ]; then
            gh api --method DELETE \
              "/repos/${{ github.repository }}/issues/comments/$PREV" \
              2>/dev/null || true
          fi
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "$BODY"

  # ── Bundle Size Diff (PR only) ──────────────────────────────────────────
  # Downloads the base branch bundle size artifact, compares with the current
  # branch, posts a PR comment with per-component deltas, and blocks merge on
  # budget violations. Budgets are configured in bundle-budgets.json.

  bundle-size:
    name: Bundle Size
    needs: [changes, secret-scan, build]
    if: >
      github.event_name == 'pull_request' &&
      needs.changes.outputs.is_audit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter='!docs'
      - name: Generate HEAD bundle sizes
        run: node scripts/bundle-size-report.js --save .cache/bundle-size-head.json
      - name: Download BASE branch bundle size artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache
          BASE_BRANCH="${{ github.base_ref }}"

          # Find the latest successful CI run on the base branch
          RUN_ID=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/ci.yml/runs" \
            -f branch="$BASE_BRANCH" \
            -f status=success \
            -f per_page=5 \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | first | .id' \
            2>/dev/null || echo "")

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful CI run found on $BASE_BRANCH — skipping base comparison"
            exit 0
          fi

          ARTIFACT_ID=$(gh api \
            "/repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "bundle-size-report") | .id' \
            2>/dev/null | head -1 || echo "")

          if [ -z "$ARTIFACT_ID" ]; then
            echo "No bundle-size-report artifact found in run $RUN_ID on $BASE_BRANCH — skipping base comparison"
            exit 0
          fi

          echo "Downloading base artifact $ARTIFACT_ID from run $RUN_ID (branch: $BASE_BRANCH)"
          gh api "/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
            > .cache/bundle-base.zip
          unzip -p .cache/bundle-base.zip bundle-size-report.json > .cache/bundle-size-base.json
          echo "Base artifact downloaded successfully"
      - name: Generate PR comment
        run: |
          BASE_FLAG=""
          if [ -f ".cache/bundle-size-base.json" ]; then
            BASE_FLAG="--base .cache/bundle-size-base.json"
          fi
          node scripts/bundle-size-report.js \
            --from-file .cache/bundle-size-head.json \
            --pr-comment $BASE_FLAG > .cache/pr-comment.md
      - name: Post PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(cat .cache/pr-comment.md)
          # Delete any previous bundle size comment before posting
          PREV=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --json comments \
            --jq '.comments[] | select(.body | startswith("## Bundle Size Report")) | .id' \
            2>/dev/null | head -1 || true)
          if [ -n "$PREV" ]; then
            gh api --method DELETE \
              "/repos/${{ github.repository }}/issues/comments/$PREV" \
              2>/dev/null || true
          fi
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "$BODY"
      - name: Enforce budget — fail on violations
        run: |
          node scripts/bundle-size-report.js \
            --from-file .cache/bundle-size-head.json \
            --ci

  # ── Visual Regression Tests ─────────────────────────────────────────────

  vrt:
    name: Visual Regression
    needs: [changes, secret-scan]
    if: >
      needs.changes.outputs.source == 'true' &&
      needs.changes.outputs.is_audit != 'true' &&
      !contains(github.head_ref || github.ref_name, 'audit-fix')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed components
        id: detect
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep 'src/components/hx-' \
              | sed 's|.*src/components/\(hx-[^/]*\)/.*|\1|' \
              | sort -u \
              | tr '\n' ',' | sed 's/,$//')
          else
            CHANGED=$(git diff --name-only HEAD~1...HEAD \
              | grep 'src/components/hx-' \
              | sed 's|.*src/components/\(hx-[^/]*\)/.*|\1|' \
              | sort -u \
              | tr '\n' ',' | sed 's/,$//')
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGED" ]; then
            echo "No component source changes — VRT will skip"
          else
            echo "VRT scoped to: $CHANGED"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.changed != ''
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.changed != ''
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
        if: steps.detect.outputs.changed != ''
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
        if: steps.detect.outputs.changed != ''
      - name: Restore VRT baselines
        if: steps.detect.outputs.changed != ''
        id: vrt-cache
        uses: actions/cache@v4
        with:
          path: packages/hx-library/__screenshots__
          key: vrt-screenshots-${{ hashFiles('packages/hx-library/src/**/*.ts') }}
          restore-keys: |
            vrt-screenshots-
      - run: pnpm run build:storybook
        if: steps.detect.outputs.changed != ''
      - name: Serve Storybook and run VRT
        if: steps.detect.outputs.changed != ''
        env:
          CHANGED_COMPONENTS: ${{ steps.detect.outputs.changed }}
          VRT_CACHE_HIT: ${{ steps.vrt-cache.outputs.cache-hit }}
        run: |
          pnpm exec http-server apps/storybook/dist -p 3151 &
          sleep 5
          # Run update mode when: no baselines exist, OR cache was only a partial/fallback hit
          # (cache-hit == 'true' means exact key match — source files unchanged since last baseline)
          # (cache-hit != 'true' means fallback restore — source changed, baselines are stale)
          if [ ! -d "packages/hx-library/__screenshots__" ] || [ -z "$(ls -A packages/hx-library/__screenshots__ 2>/dev/null)" ]; then
            echo "No VRT baselines found — creating initial baselines"
            pnpm run test:vrt:update
          elif [ "$VRT_CACHE_HIT" != "true" ]; then
            echo "Stale VRT baselines (fallback cache hit) — regenerating for current source"
            pnpm run test:vrt:update
          else
            pnpm run test:vrt
          fi
      - name: Upload VRT diff images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-diffs
          path: packages/hx-library/.cache/vrt-results/
          retention-days: 7
          if-no-files-found: warn

  # ── Changeset gate ──────────────────────────────────────────────────────
  # Every PR that modifies component source must include a .changeset/*.md file.
  # Bypass with label "skip-changeset" for infra-only changes (CI, scripts, docs).
  # Skipped on: audit branches, push events (not PRs), and non-source PRs.

  changeset:
    name: Changeset Required
    needs: [changes, secret-scan]
    if: >
      github.event_name == 'pull_request' &&
      needs.changes.outputs.is_audit != 'true' &&
      needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for changeset
        run: |
          # Allow bypass via PR label
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          if echo "$LABELS" | grep -q "skip-changeset"; then
            echo "Label 'skip-changeset' found — bypassing changeset requirement."
            exit 0
          fi

          # Check for .changeset/*.md files in this PR (exclude README.md)
          CHANGED_CHANGESETS=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep '^\.changeset/.*\.md$' \
            | grep -v 'README\.md' || true)

          if [ -z "$CHANGED_CHANGESETS" ]; then
            echo "::error::No changeset found for this PR."
            echo ""
            echo "Every PR that modifies component source must include a changeset."
            echo "Run: npx changeset"
            echo "Or add label 'skip-changeset' for infra-only changes."
            exit 1
          fi

          echo "Changeset found:"
          echo "$CHANGED_CHANGESETS"

  # ── Security Audit ──────────────────────────────────────────────────────

  audit:
    name: Security Audit
    needs: [changes, secret-scan]
    if: needs.changes.outputs.is_audit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Security audit
        run: |
          AUDIT_OUTPUT=$(pnpm audit --audit-level=critical 2>&1)
          AUDIT_EXIT=$?
          echo "$AUDIT_OUTPUT"
          if [ $AUDIT_EXIT -ne 0 ]; then
            if echo "$AUDIT_OUTPUT" | grep -qE "ECONNRESET|ECONNREFUSED|ETIMEDOUT|ENOTFOUND|network error|code ELIFECYCLE"; then
              echo "::warning::pnpm audit registry endpoint unavailable — skipping vulnerability check"
            else
              echo "::error::Critical vulnerabilities found — see audit output above"
              exit 1
            fi
          fi

  # ── Storybook Interaction Tests ─────────────────────────────────────────
  # Runs all 83 component story play functions as Vitest browser mode tests.
  # Uses @storybook/addon-vitest (Storybook 10 first-class Vitest integration).
  # Informational until baseline is verified — does not block Quality Gates.

  storybook-tests:
    name: Storybook Tests
    needs: [changes, secret-scan, build]
    if: needs.changes.outputs.is_audit != 'true'
    runs-on: ubuntu-latest
    # Per-file runner (apps/storybook/scripts/test-shards.mjs) spawns a
    # fresh Chromium per story file — each file finishes in ~4–5s, full
    # 84-file suite in ~6–7 minutes. Plus install + build + Playwright
    # download on a cold runner lands total CI wall time around 10–12
    # minutes worst case. 15 minutes leaves headroom for slower
    # GitHub-hosted runners without reintroducing the 45m band-aid.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build library and generate CEM
        run: pnpm turbo run build --filter='!docs' && pnpm run cem
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Storybook interaction tests
        # The per-file runner invokes vitest once per story file so each
        # file gets a fresh Chromium. Prevents the cumulative browser
        # state crash ("Browser connection was closed") that occurred when
        # vitest kept a single page alive across the whole suite
        # (see apps/storybook/scripts/test-shards.mjs header for the
        # full analysis).
        run: pnpm run test:storybook
      - name: Upload Storybook test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-test-results
          path: apps/storybook/.vitest/
          retention-days: 14
          if-no-files-found: warn

  # ── React wrapper tests (informational — not a required gate) ────────────
  # Runs vitest browser mode tests for @helixui/react wrappers.
  # Tests render/prop/event/ref forwarding for all generated React components.
  # continue-on-error keeps this informational until the suite is stabilized.
  test-react:
    name: Test React Wrappers
    needs: [changes, secret-scan]
    if: needs.changes.outputs.is_audit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
      - name: Run @helixui/react tests
        run: pnpm run test:react
        continue-on-error: true

  # ── Aggregate gate (for branch protection) ──────────────────────────────
  # This job depends on all checks and is the single required status check
  # in branch protection. This avoids needing to update branch protection
  # every time a job name changes.

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs:
      [
        changes,
        secret-scan,
        lint,
        format,
        react-generator-drift,
        type-check,
        test,
        coverage,
        build,
        a11y-audit,
        bundle-size,
        vrt,
        audit,
        changeset,
        storybook-tests,
        test-react,
      ]
    if: always()
    steps:
      - name: Check all gates
        run: |
          IS_AUDIT="${{ needs.changes.outputs.is_audit }}"

          echo "Audit branch:       $IS_AUDIT"
          echo "Secret Scan:        ${{ needs.secret-scan.result }}"
          echo "Lint:               ${{ needs.lint.result }}"
          echo "Format:             ${{ needs.format.result }}"
          echo "Generator Drift:    ${{ needs.react-generator-drift.result }}"
          echo "Type Check:         ${{ needs.type-check.result }}"
          echo "Test:               ${{ needs.test.result }}"
          echo "Coverage:           ${{ needs.coverage.result }}"
          echo "Build:              ${{ needs.build.result }}"
          echo "A11y Audit:         ${{ needs.a11y-audit.result }}"
          echo "Bundle Size:        ${{ needs.bundle-size.result }}"
          echo "VRT:                ${{ needs.vrt.result }}"
          echo "Audit:              ${{ needs.audit.result }}"
          echo "Storybook Tests:    ${{ needs.storybook-tests.result }}"
          echo "React Tests:        ${{ needs.test-react.result }}"

          # Audit branches skip all CI — auto-pass
          if [[ "$IS_AUDIT" == "true" ]]; then
            echo "Audit branch — all gates skipped. Auto-pass."
            exit 0
          fi

          FAIL=0

          for gate in secret-scan lint format react-generator-drift type-check build; do
            result="${{ needs.lint.result }}"
            case "$gate" in
              secret-scan)           result="${{ needs.secret-scan.result }}" ;;
              lint)                  result="${{ needs.lint.result }}" ;;
              format)                result="${{ needs.format.result }}" ;;
              react-generator-drift) result="${{ needs.react-generator-drift.result }}" ;;
              type-check)            result="${{ needs.type-check.result }}" ;;
              build)                 result="${{ needs.build.result }}" ;;
            esac
            if [[ "$result" != "success" ]]; then
              echo "::error::Gate '$gate' did not succeed: $result"
              FAIL=1
            fi
          done

          # Test, VRT, changeset, and bundle-size are allowed to be skipped
          # (non-PR / no source changes) or cancelled (concurrency group replaced a
          # running job).
          for gate in test vrt changeset bundle-size; do
            result="${{ needs.test.result }}"
            case "$gate" in
              test)        result="${{ needs.test.result }}" ;;
              vrt)         result="${{ needs.vrt.result }}" ;;
              changeset)   result="${{ needs.changeset.result }}" ;;
              bundle-size) result="${{ needs.bundle-size.result }}" ;;
            esac
            if [[ "$result" != "success" && "$result" != "skipped" && "$result" != "cancelled" ]]; then
              echo "::error::Gate '$gate' did not succeed: $result"
              FAIL=1
            fi
          done

          # Coverage is informational-only while issue #1556 is open. The
          # vitest --coverage.enabled + browser-mode + chromium combination
          # deadlocks at this surface size regardless of how the work is
          # partitioned. continue-on-error on the job stops it from failing
          # the workflow; here we explicitly accept any result so a future
          # change to that flag does not silently re-block. The 8-shard
          # uninstrumented test matrix is the real correctness signal.
          echo "Coverage (informational, #1556): ${{ needs.coverage.result }}"

          # A11y audit is a blocking gate — healthcare WCAG 2.1 AA mandate
          if [[ "${{ needs.a11y-audit.result }}" != "success" && "${{ needs.a11y-audit.result }}" != "skipped" ]]; then
            echo "::error::A11y audit failed — WCAG 2.1 AA violations detected. See a11y-report artifact."
            FAIL=1
          fi

          # Storybook tests are a blocking gate — per-file runner + story fixes
          # landed in the same PR that flipped this from informational. Any
          # future regression in a play() function blocks merge, matching the
          # release-quality-gate doctrine in CLAUDE.md.
          if [[ "${{ needs.storybook-tests.result }}" != "success" && "${{ needs.storybook-tests.result }}" != "skipped" ]]; then
            echo "::error::Storybook interaction tests failed — see storybook-test-results artifact for details"
            FAIL=1
          fi

          # React wrapper tests are informational until the suite is stabilized
          if [[ "${{ needs.test-react.result }}" != "success" && "${{ needs.test-react.result }}" != "skipped" ]]; then
            echo "::warning::React wrapper tests did not pass — informational only"
          fi

          # Security audit is informational until npm audit endpoint is stabilized
          if [[ "${{ needs.audit.result }}" != "success" && "${{ needs.audit.result }}" != "skipped" ]]; then
            echo "::warning::Security audit did not pass — npm audit endpoint may be retired. See https://api-docs.npmjs.com/#tag/Audit"
          fi

          if [[ "$FAIL" -eq 1 ]]; then
            echo "::error::One or more quality gates failed"
            exit 1
          fi

          echo "All quality gates passed!"
