# ============================================================================
# Publish Pipeline — wc-2026 Enterprise Healthcare Web Component Library
# ============================================================================
# Triggers on push to main or manual dispatch. If unreleased changesets exist, bumps versions
# and publishes to npm directly. Version bump is pushed back via a PR.
#
# Tests are NOT re-run here — CI (ci.yml) already validates
# all code before it reaches main via the staging→main promotion flow.
# ci-matrix.yml is disabled (workflow_dispatch only) and is not part of the gate.
#
# Required secrets:
#   CHANGESET_TOKEN — PAT or fine-grained token with contents:write + pull-requests:write
#                     (GITHUB_TOKEN suppresses workflow events on PRs it creates, so a
#                     dedicated token is required to trigger CI on version bump PRs)
#   NPM_TOKEN       — npm automation token (must be added to repo settings by repo admin)
# ============================================================================

name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # ── Pre-publish secret scan ─────────────────────────────────────────────
  # Scans each publishable package tarball for secrets before anything
  # reaches npm. Uses `pnpm pack` to produce the exact artifact that would
  # be published, then extracts it and runs gitleaks in no-git mode.
  # The publish job will not start if this job fails.

  secret-scan:
    name: Pre-publish Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate Custom Elements Manifest
        run: pnpm --filter=@helixui/library run cem
        # CEM must be up-to-date with the tagged commit. Regenerating here
        # catches any stale manifest that would ship to consumers with
        # inaccurate API docs or broken React wrapper generation.

      - name: Verify CEM matches committed manifest
        run: |
          # `git status --porcelain` catches both modified AND untracked changes;
          # `git diff --exit-code` would silently pass if the committed file was
          # deleted and regeneration re-created it as untracked.
          STATUS=$(git status --porcelain -- packages/hx-library/custom-elements.json)
          if [ -n "$STATUS" ]; then
            echo "::error::custom-elements.json is out of date. Run 'pnpm run cem' and commit before tagging."
            echo "$STATUS"
            exit 1
          fi
          echo "CEM matches committed manifest."

      - name: Verify Figma inventory matches committed snapshot
        run: |
          STATUS=$(git status --porcelain -- packages/hx-library/figma-inventory.json)
          if [ -n "$STATUS" ]; then
            echo "::error::figma-inventory.json drifted after CEM regeneration. Run 'pnpm --filter=@helixui/library run figma:inventory' and commit before tagging."
            echo "$STATUS"
            exit 1
          fi
          pnpm --filter=@helixui/library run figma:inventory:check

      - name: Build packages
        run: |
          pnpm turbo run build \
            --filter=@helixui/library \
            --filter=@helixui/tokens \
            --filter=@helixui/react \
            --filter=@helixui/drupal-behaviors \
            --filter=@helixui/drupal-starter \
            --filter=@helixui/mcp

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan publishable package tarballs for secrets
        run: |
          SCAN_DIR="$(mktemp -d)"
          FAIL=0

          # Derive the list of publishable packages from the workspace rather
          # than hardcoding it — any package with "private": true is skipped,
          # anything else is treated as publishable and scanned.
          PKG_DIRS=$(node -e "
            const fs=require('fs'),path=require('path');
            for (const d of fs.readdirSync('packages')) {
              const p=path.join('packages',d,'package.json');
              if (!fs.existsSync(p)) continue;
              const pkg=JSON.parse(fs.readFileSync(p,'utf8'));
              if (pkg.private) continue;
              console.log(path.join('packages',d));
            }
          ")

          for pkg_dir in $PKG_DIRS; do
            if [ ! -f "$pkg_dir/package.json" ]; then
              echo "Skipping $pkg_dir — no package.json"
              continue
            fi

            PKG_NAME=$(node -p "require('./$pkg_dir/package.json').name" 2>/dev/null || echo "unknown")
            echo "Packing $PKG_NAME ($pkg_dir)..."

            PKG_PACK_DIR="$SCAN_DIR/pack-$(basename "$pkg_dir")"
            mkdir -p "$PKG_PACK_DIR"
            if ! PACK_OUTPUT=$(cd "$pkg_dir" && pnpm pack --pack-destination "$PKG_PACK_DIR" 2>&1); then
              echo "::error::Failed to produce tarball for $PKG_NAME"
              echo "$PACK_OUTPUT"
              FAIL=1
              continue
            fi

            TARBALL=$(find "$PKG_PACK_DIR" -maxdepth 1 -type f -name '*.tgz' -print -quit)

            if [ -z "$TARBALL" ]; then
              echo "::error::Failed to produce tarball for $PKG_NAME"
              FAIL=1
              continue
            fi

            EXTRACT_DIR="$SCAN_DIR/extract-$(basename "$TARBALL" .tgz)"
            mkdir -p "$EXTRACT_DIR"
            tar -xzf "$TARBALL" -C "$EXTRACT_DIR"

            echo "Scanning $PKG_NAME tarball contents..."
            if ! gitleaks detect \
              --source "$EXTRACT_DIR" \
              --config .gitleaks.toml \
              --no-git \
              --verbose \
              --report-format json \
              --report-path "$SCAN_DIR/report-$(basename "$pkg_dir").json" \
              --exit-code 1; then
              echo "::error::Secrets detected in $PKG_NAME tarball — publish blocked"
              echo "--- Report contents ---"
              cat "$SCAN_DIR/report-$(basename "$pkg_dir").json" 2>/dev/null || echo "No report file"
              echo "--- End report ---"
              FAIL=1
            else
              echo "$PKG_NAME — clean"
            fi
          done

          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Pre-publish secret scan failed. Fix detected secrets before publishing."
            exit 1
          fi

          echo "All package tarballs passed secret scan."
        working-directory: .

  publish:
    name: Publish to npm
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ── npm Trusted Publishing (OIDC) ───────────────────────────────────────
    # The `npm-publish` GitHub Environment scopes the OIDC identity that npm's
    # Trusted Publisher entries federate against (org=bookedsolidtech,
    # repo=helix, workflow=publish.yml, env=npm-publish). No long-lived
    # NPM_TOKEN is used — auth is the GitHub Actions OIDC token via pnpm's
    # native trusted-publishing support. `id-token: write` below is required
    # for the runner to mint that token.
    environment: npm-publish
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm turbo run build \
            --filter=@helixui/library \
            --filter=@helixui/tokens \
            --filter=@helixui/react \
            --filter=@helixui/drupal-behaviors \
            --filter=@helixui/drupal-starter \
            --filter=@helixui/mcp

      - name: Verify CEM matches committed manifest
        run: |
          pnpm --filter=@helixui/library run cem
          STATUS=$(git status --porcelain -- packages/hx-library/custom-elements.json)
          if [ -n "$STATUS" ]; then
            echo "::error::custom-elements.json is out of date. Run 'pnpm run cem' and commit before tagging."
            echo "$STATUS"
            exit 1
          fi
          echo "CEM matches committed manifest."

      - name: Verify Figma inventory matches committed snapshot
        run: |
          STATUS=$(git status --porcelain -- packages/hx-library/figma-inventory.json)
          if [ -n "$STATUS" ]; then
            echo "::error::figma-inventory.json drifted after CEM regeneration. Run 'pnpm --filter=@helixui/library run figma:inventory' and commit before tagging."
            echo "$STATUS"
            exit 1
          fi
          pnpm --filter=@helixui/library run figma:inventory:check

      - name: Build CDN artifacts
        run: pnpm --filter=@helixui/library run build:cdn

      - name: Version and Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run changeset:publish
          version: pnpm run changeset:version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESET_TOKEN }}
          # NODE_AUTH_TOKEN intentionally removed — auth is OIDC Trusted
          # Publishing. An empty/legacy NODE_AUTH_TOKEN makes npm attempt
          # token auth and skip OIDC, so the line is removed entirely.
          NPM_CONFIG_PROVENANCE: 'true'
          # Disable husky pre-push hooks during CI git operations (tag pushes,
          # version bump commits). The hook is designed for developer workflows,
          # not for internal CI git operations.
          HUSKY: '0'

      - name: Generate release manifest
        if: steps.changesets.outputs.published == 'true'
        id: manifest
        run: node scripts/generate-release-manifest.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        # Emits docs/releases/<tag>-manifest.json with SHA, CI run ID,
        # changeset list, bundle size snapshot, CEM SHA, and publish actor.
        # Runs only on an actual publish — when changesets/action bumps
        # versions without publishing (PR path), no manifest is generated.

      - name: Open release manifest PR
        if: steps.changesets.outputs.published == 'true'
        env:
          CHANGESET_TOKEN: ${{ secrets.CHANGESET_TOKEN }}
          GH_TOKEN: ${{ secrets.CHANGESET_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          HUSKY: '0'
        run: |
          set -euo pipefail
          if ! git status --porcelain docs/releases/ | grep -q .; then
            echo "No release manifest changes to commit."
            exit 0
          fi

          VERSION=$(node -e '
            try {
              const a = JSON.parse(process.env.PUBLISHED_PACKAGES || "[]");
              const p = a.find((x) => x.name === "@helixui/library");
              console.log(p ? p.version : "");
            } catch {
              console.log("");
            }
          ')
          if [ -z "${VERSION}" ]; then
            VERSION="run-${GITHUB_RUN_ID}"
          fi
          # Include both GITHUB_RUN_ID and GITHUB_RUN_ATTEMPT so reruns of the
          # same published version produce a unique branch name. GITHUB_RUN_ID
          # is stable across reruns of a single workflow run; only RUN_ATTEMPT
          # increments. Without RUN_ATTEMPT, a rerun would collide with the
          # pre-existing release-manifest branch from the failed first attempt
          # and cause a non-fast-forward push that orphans the PR.
          BRANCH="release-manifest/${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Stage the freshly-generated manifest, then rebuild the branch from
          # origin/main so the PR contains only the manifest diff.
          MANIFEST_STAGE=$(mktemp -d)
          cp -R docs/releases/. "${MANIFEST_STAGE}/"
          git fetch origin main
          git checkout -B "${BRANCH}" origin/main
          mkdir -p docs/releases
          cp -R "${MANIFEST_STAGE}/." docs/releases/
          git add docs/releases/
          if git diff --cached --quiet; then
            echo "Manifest already present on main — nothing to commit."
            exit 0
          fi
          git commit -m "chore(release): add ${VERSION} release manifest"

          REMOTE="https://x-access-token:${CHANGESET_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "${REMOTE}" "HEAD:${BRANCH}"

          # CHANGESET_TOKEN must carry `contents: write` + `pull-requests: write`.
          # The manifest is prettier-ignored (see .prettierignore) and path-only;
          # required status checks complete quickly on doc-only diffs.
          PR_URL=$(gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "chore(release): add ${VERSION} release manifest" \
            --body "Post-publish manifest for \`${VERSION}\`. Auto-opened by the publish workflow after npm publish succeeded. Documentation only — safe to auto-merge.")
          echo "Opened: ${PR_URL}"
          # Enabling auto-merge must succeed — otherwise the manifest PR is
          # orphaned and main drifts from the published npm artifact with no
          # alarm. Treat failure as a hard error so the release is visibly
          # incomplete until an operator merges the PR.
          if ! gh pr merge "${PR_URL}" --merge --auto; then
            echo "::error title=Release manifest auto-merge failed::Could not enable auto-merge on ${PR_URL}. The release manifest PR is open but not queued; main is out of sync with the published npm artifact until this PR is merged manually."
            exit 1
          fi
