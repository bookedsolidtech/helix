# .reagent/policy.yaml — generated by @bookedsolid/reagent v0.12.0
# Commit this file. Edit autonomy_level and max_autonomy_level as needed.
# Run 'reagent freeze --reason "..."' to halt all agent operations.

version: '1'
profile: 'bst-internal'
installed_by: 'reagent@0.15.6'
installed_at: '2026-04-11T02:41:40.155Z'

# Autonomy levels:
#   L0 — Read-only; every write requires explicit user approval
#   L1 — Writes allowed to non-blocked paths; destructive operations blocked
#   L2 — Writes + PR creation allowed; destructive tier blocked
#   L3 — All writes allowed; advisory on anomalous patterns
autonomy_level: L1
max_autonomy_level: L2

# Human must approve any autonomy level increase
promotion_requires_human_approval: true

# Block AI attribution in commits and PRs (opt-in)
# When true, the commit-msg hook rejects commits containing AI attribution
# markers (Co-Authored-By, "Generated with [Tool]", etc.) and the
# attribution-advisory hook blocks gh pr create/edit commands with attribution.
# Casual mentions of AI tools in commit messages are still allowed.
block_ai_attribution: true

# Paths hooks and agents must never modify
blocked_paths:
  - .env
  - .reagent/HALT

# Optional: Discord webhook for halt/promote notifications
notification_channel: ''

# Push review gate — disabled by Jake 2026-04-11
push_review: false

# Coverage quality gate (opt-in)
# When enabled, the pre-push hook enforces minimum test coverage before push.
# Requires @vitest/coverage-v8 (or equivalent) installed in the project.
#   enabled   — set to true to activate the gate
#   threshold — minimum percentage for lines, functions, and statements
#               branches threshold is automatically set to threshold - 10
coverage:
  enabled: false
  threshold: 80

# Security disclosure configuration
# Controls how the security-disclosure-gate hook routes security findings:
#   advisory — public OSS repos: redirect to GitHub Security Advisories (default)
#   issues   — private client repos: redirect to labeled internal issue queue
#   disabled — no gate (not recommended)
security:
  disclosure_mode: 'advisory'
context_protection:
  delegate_to_subagent:
    - pnpm run preflight
    - pnpm run test
    - pnpm run build
  max_bash_output_lines: 100
