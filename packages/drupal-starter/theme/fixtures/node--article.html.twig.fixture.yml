default:
  label: 'Understanding Type 2 Diabetes: A Patient Guide'
  page: true
  node:
    label: 'Understanding Type 2 Diabetes: A Patient Guide'
    bundle: article
  url: '/articles/understanding-type-2-diabetes'
  date: 'March 25, 2026'
  author_name: 'Dr. Sarah Chen, MD'
  content:
    body:
      '#markup': |
        <p>Type 2 diabetes is a chronic condition that affects the way your body metabolizes
        sugar (glucose). With type 2 diabetes, your body either resists the effects of
        insulin — a hormone that regulates the movement of sugar into your cells — or
        does not produce enough insulin to maintain a normal glucose level.</p>
        <p>Type 2 diabetes used to be known as adult-onset diabetes, but today more
        children are being diagnosed with the disorder, probably due to the rise in
        childhood obesity. There's no cure for type 2 diabetes, but losing weight,
        eating well and exercising can help you manage the disease.</p>
    field_image:
      '#markup': '<img src="/placeholder/800x400?text=Diabetes+Guide" alt="Doctor reviewing patient chart" loading="lazy" />'
    field_tags:
      '#markup': '<span>Diabetes</span><span>Patient Education</span><span>Chronic Disease</span>'
  attributes: {}
  title_attributes: {}
  content_attributes: {}

