$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Radio Group
description: 'Form-associated radio group that manages hx-radio children. Renders a fieldset with legend, keyboard navigation, validation, and help text for Drupal radios.'
status: experimental
group: Forms
props:
  type: object
  properties:
    name:
      type: string
      title: Name
      description: 'The form field name shared across all radio options'
    label:
      type: string
      title: Label
      description: 'The fieldset legend / group label text'
    value:
      type: string
      title: Value
      description: 'The currently selected radio value'
    orientation:
      type: string
      title: Orientation
      description: 'Layout direction of the radio options'
      default: 'vertical'
      enum:
        - vertical
        - horizontal
    required:
      type: boolean
      title: Required
      description: 'Whether a selection is required'
      default: false
    disabled:
      type: boolean
      title: Disabled
      description: 'Whether all radio options are disabled'
      default: false
    error:
      type: string
      title: Error
      description: 'Validation error message'
    help_text:
      type: string
      title: Help Text
      description: 'Supporting help text displayed below the group'
slots:
  default:
    title: Radio Options
    description: 'hx-radio elements for each option in the group'
