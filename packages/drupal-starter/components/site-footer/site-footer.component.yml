$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Site Footer
description: 'Site-wide footer with column-based link areas, bottom bar, and copyright. Composes hx-container, hx-text, hx-link, hx-divider.'
status: experimental
group: Layout
props:
  type: object
  properties:
    copyright:
      type: string
      title: Copyright
      description: 'Copyright notice text displayed in the bottom bar'
slots:
  columns:
    title: Columns
    description: 'Footer column areas for link groups and content'
  bottom:
    title: Bottom
    description: 'Bottom bar area for secondary links or legal text'
