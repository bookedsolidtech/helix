$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Switch
description: 'Form-associated toggle switch with label, error, and help text. For boolean settings, notification preferences, and feature toggles in Drupal configuration forms.'
status: experimental
group: Forms
props:
  type: object
  properties:
    name:
      type: string
      title: Name
      description: 'The form field name'
    label:
      type: string
      title: Label
      description: 'Visible label text'
    value:
      type: string
      title: Value
      description: 'Value submitted when the switch is checked'
      default: 'on'
    checked:
      type: boolean
      title: Checked
      description: 'Whether the switch is toggled on'
      default: false
    size:
      type: string
      title: Size
      description: 'Visual size variant'
      default: 'md'
      enum:
        - sm
        - md
        - lg
    required:
      type: boolean
      title: Required
      description: 'Whether the field is required'
      default: false
    disabled:
      type: boolean
      title: Disabled
      description: 'Whether the switch is disabled'
      default: false
    error:
      type: string
      title: Error
      description: 'Validation error message'
    help_text:
      type: string
      title: Help Text
      description: 'Supporting help text'
