# helixui.libraries.yml
#
# Drupal 10/11 asset library definitions for @helixui/library
#
# AUTO-GENERATED — do not edit this file manually.
# Regenerate with: pnpm run generate:drupal-libraries
#
# Version : 1.1.2
# Mode    : local (/libraries/helixui)
#
# Twig usage examples:
#   {{ attach_library('helixui/core') }}
#   {{ attach_library('helixui/hx-button') }}
#   {{ attach_library('helixui/all') }}
# --- Base library (tokens CSS + JS runtime) ---

core:
  version: 1.1.2
  css:
    theme:
      /libraries/helixui/dist/css/helix-tokens.css: { minified: true }
      /libraries/helixui/dist/css/helix-core.css: { minified: true }
  js:
    /libraries/helixui/dist/index.js: { attributes: { type: module }, minified: true }

