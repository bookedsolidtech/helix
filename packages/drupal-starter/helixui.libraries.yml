# HELiX UI Drupal Libraries
# Maps @helixui/library web components to Drupal library definitions.
# Each library loads the component JS and optional CSS via CDN or local paths.
# TODO: Auto-generate from @helixui/library custom-elements.json via CEM-to-Drupal generator.

# --- Base library (tokens + core runtime) ---

hx-core:
  version: VERSION
  css:
    theme:
      /libraries/helixui/dist/css/helix-tokens.css: { minified: true }
      /libraries/helixui/dist/css/helix-core.css: { minified: true }
  js:
    /libraries/helixui/dist/index.js: { type: module, minified: true }

